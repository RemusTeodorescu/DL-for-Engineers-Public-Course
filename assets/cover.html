// ---------- helpers ----------
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const bump=(x,a,b,c,d)=>smooth(a,b,x)*(1-smooth(c,d,x));
const DEG=Math.PI/180;
const DAY_SECONDS=30;

// ---------- font -> shapes ----------
function glyph(ch,size){
  const g=FONT.glyphs[ch], sc=size/FONT.resolution, path=new THREE.ShapePath();
  if(g.o){const o=g.o.trim().split(/\s+/);let i=0;
    while(i<o.length){const a=o[i++];
      if(a==='m')path.moveTo(o[i++]*sc,o[i++]*sc);
      else if(a==='l')path.lineTo(o[i++]*sc,o[i++]*sc);
      else if(a==='q'){const x=o[i++]*sc,y=o[i++]*sc,cx=o[i++]*sc,cy=o[i++]*sc;path.quadraticCurveTo(cx,cy,x,y);}
      else if(a==='b'){const x=o[i++]*sc,y=o[i++]*sc,c1x=o[i++]*sc,c1y=o[i++]*sc,c2x=o[i++]*sc,c2y=o[i++]*sc;path.bezierCurveTo(c1x,c1y,c2x,c2y,x,y);}
    }}
  return {shapes:path.toShapes(false),ha:g.ha*sc};
}

// ---------- waves (shared by GPU and CPU) ----------
const WAVES=[[0.92,0.39,62,0.12],[-0.55,0.83,33,0.11],[0.71,-0.7,19,0.10],[-0.95,-0.3,11.5,0.08],
             [0.2,0.98,7,0.06],[-0.83,0.55,4.4,0.05],[0.6,0.8,2.6,0.05],[-0.3,-0.95,1.6,0.045]];
const WAVE_UNI=WAVES.map(w=>{const l=Math.hypot(w[0],w[1]);return new THREE.Vector4(w[0]/l,w[1]/l,w[2],w[3]);});
const G=9.81;
const _g={y:0,dx:0,dz:0,nx:0,ny:1,nz:0};
function gerstner(x,z,t,inten){
  let px=0,py=0,pz=0,tx=1,ty=0,tz=0,bx=0,by=0,bz=1;
  for(let i=0;i<8;i++){const w=WAVE_UNI[i];const k=2*Math.PI/w.z,c=Math.sqrt(G/k),s=w.w*inten,a=s/k;
    const f=k*(w.x*x+w.y*z)-c*k*t, sf=Math.sin(f), cf=Math.cos(f);
    px+=w.x*a*cf; py+=a*sf; pz+=w.y*a*cf;
    tx+=-w.x*w.x*s*sf; ty+=w.x*s*cf; tz+=-w.x*w.y*s*sf;
    bx+=-w.x*w.y*s*sf; by+=w.y*s*cf; bz+=-w.y*w.y*s*sf;}
  let nx=by*tz-bz*ty, ny=bz*tx-bx*tz, nz=bx*ty-by*tx; const l=Math.hypot(nx,ny,nz)||1;
  _g.y=py;_g.dx=px;_g.dz=pz;_g.nx=nx/l;_g.ny=ny/l;_g.nz=nz/l; return _g;
}
function waterAt(x,z,t,inten){let dx=0,dz=0,r;for(let i=0;i<3;i++){r=gerstner(x-dx,z-dz,t,inten);dx=r.dx;dz=r.dz;}return r;}

// ---------- weather progression: alternating winter / summer days ----------
// p = fraction of the day (0 midnight .. 1 midnight). Returns raw weather for a season.
function weatherFor(winter,p){
  const W={};
  if(winter){
    const rain=bump(p,0.08,0.2,0.36,0.44), snow=bump(p,0.38,0.46,0.84,0.93), bliz=bump(p,0.56,0.63,0.73,0.8);
    const clearing=smooth(0.82,0.95,p);
    W.rain=rain*1.3; W.snow=snow*(1+1.8*bliz); W.blizzard=bliz;
    W.cloud=lerp(0.92+0.08*bliz,0.3,clearing); W.fog=0.0045+rain*0.003+snow*0.0025+bliz*0.022-clearing*0.002;
    W.wave=1.05+0.25*rain+0.4*bliz-0.35*clearing; W.wind=[0.8*(1+2.2*bliz),-0.6*(1+2.2*bliz)];
    W.deep=[0.010,0.028,0.038]; W.scatter=[0.09,0.19,0.19];
    W.ice=smooth(0.47,0.84,p); W.degrade=1-smooth(0.0,0.14,p); W.scorch=0;
  }else{
    const scorch=bump(p,0.28,0.48,0.7,0.86);
    W.rain=0; W.snow=0; W.blizzard=0;
    W.cloud=0.32-0.24*scorch; W.fog=0.0009+scorch*0.0022; W.wave=0.5-0.2*scorch; W.wind=[-0.4,0.3];
    W.deep=[0.005,0.045,0.10]; W.scatter=[0.05,0.36,0.42];
    W.ice=1-smooth(0.0,0.16,p); W.degrade=smooth(0.3,0.82,p); W.scorch=scorch;
  }
  return W;
}
function blendW(A,B,t){const o={};for(const k in A){if(Array.isArray(A[k]))o[k]=A[k].map((v,i)=>lerp(v,B[k][i],t));else o[k]=lerp(A[k],B[k],t);}return o;}

// ---------- shaders ----------
const skyVert=`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const skyFragBody=`
uniform vec3 uSunDir,uMoonDir,uZenith,uHorizon,uSunColor,uCloudLit,uCloudShadow,uFogColor,uOcean;
uniform float uSunI,uMoonI,uCloudCover,uNight,uTime,uHaze,uScorch; uniform vec2 uWind;
varying vec3 vDir;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<6;i++){v+=a*noise(p);p=m*p;a*=.5;}return v;}
float hash3(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
vec3 skyColor(){
  vec3 d=normalize(vDir); float y=d.y;
  vec3 col=mix(uHorizon,uZenith,pow(clamp(y,0.,1.),0.55));
  col=mix(col,vec3(0.95,0.93,0.85),uScorch*0.35*(1.-smoothstep(0.,0.6,y)));
  float sd=max(dot(d,uSunDir),0.);
  float low=1.-smoothstep(0.0,0.35,uSunDir.y);
  float vis=smoothstep(-0.03,0.0,uSunDir.y);
  col+=uSunColor*(pow(sd,4.)*0.22*(0.3+low)+pow(sd,40.)*0.9+pow(sd,10.)*uScorch*1.6)*vis;
  col+=uSunColor*smoothstep(0.9986,0.9991,sd)*(14.0+8.0*uScorch)*vis;
  float md=max(dot(d,uMoonDir),0.);
  vec3 mT=normalize(cross(uMoonDir,vec3(0.,1.,0.)));vec3 mB=cross(uMoonDir,mT);
  vec2 muv=vec2(dot(d,mT),dot(d,mB))*30.;
  float maria=noise(muv*3.+7.3)*0.55+noise(muv*8.)*0.45;
  float mdisc=smoothstep(0.9991,0.9994,md);
  vec3 moonCol=vec3(0.92,0.92,0.86)*(0.5+0.5*maria);
  col+=moonCol*mdisc*3.2*uMoonI+vec3(0.8,0.85,0.95)*pow(md,120.)*0.35*uMoonI;
  if(y>0.){vec3 c=floor(d*260.);float h=hash3(c);float st=smoothstep(0.994,1.0,h)*(0.6+0.4*sin(uTime*2.+h*90.));
    col+=vec3(0.8,0.85,1.0)*st*uNight*0.9*smoothstep(0.,0.1,y);}
  if(y>0.004){
    vec2 uv=d.xz/(y+0.12)*1.2+uWind*uTime*0.03;
    float n=fbm(uv);
    float e0=0.7-0.55*uCloudCover,e1=e0+0.16;
    float a=smoothstep(e0,e1,n)*smoothstep(0.0,0.12,y);
    float thick=smoothstep(e0,e1+0.35,n);
    vec3 cc=mix(uCloudLit*1.12,uCloudShadow*0.8,thick);
    cc+=uSunColor*pow(sd,6.)*0.5*uSunI*(1.-thick);
    col=mix(col,cc,a);
    col=mix(col,uFogColor,uHaze*(1.-smoothstep(0.,0.3,y)));
  }
  col=mix(uFogColor,col,smoothstep(-0.015,0.015,y));
#ifdef CUBE
  col=mix(col,uOcean,smoothstep(-0.01,-0.4,y));
#endif
  return col;
}`;
const skyFragMain=skyFragBody+`void main(){gl_FragColor=vec4(skyColor(),1.);
#include <tonemapping_fragment>
#include <encodings_fragment>
}`;
const skyFragCube=`#define CUBE 1\n`+skyFragBody+`void main(){gl_FragColor=vec4(skyColor()*0.5,1.);
#include <encodings_fragment>
}`;

const waterVert=`
uniform float uTime,uIntensity; uniform vec4 uWaves[8];
varying vec3 vWorld,vNormal; varying float vCrest,vJ;
void main(){
  vec3 p=vec3(position.x,0.,position.z);
  float dist=length(p.xz-cameraPosition.xz);
  vec3 P=p,T=vec3(1.,0.,0.),B=vec3(0.,0.,1.); float amp=0.,cr=0.;
  for(int i=0;i<8;i++){vec4 w=uWaves[i];float k=6.2831853/w.z,c=sqrt(9.81/k);
    float fade=1.-smoothstep(w.z*30.,w.z*110.,dist);
    float s=w.w*uIntensity*fade,a=s/k;
    float f=k*dot(w.xy,p.xz)-c*k*uTime,sf=sin(f),cf=cos(f);
    P.x+=w.x*a*cf;P.y+=a*sf;P.z+=w.y*a*cf; amp+=a; cr+=a*sf;
    T+=vec3(-w.x*w.x*s*sf,w.x*s*cf,-w.x*w.y*s*sf);
    B+=vec3(-w.x*w.y*s*sf,w.y*s*cf,-w.y*w.y*s*sf);}
  vNormal=normalize(cross(B,T)); vWorld=P; vCrest=cr/max(amp,0.001);
  vJ=T.x*B.z-T.z*B.x;
  gl_Position=projectionMatrix*viewMatrix*vec4(P,1.);
}`;
const waterFrag=`
uniform samplerCube uEnv; uniform vec3 uSunDir,uMoonDir,uSunColor,uDeep,uScatter,uFogColor,uSkyLight,uGlowPos[8],uGlowCol[8];
uniform vec4 uSplash[2]; uniform vec4 uWhale; uniform float uWhaleOn;
uniform float uTime,uIntensity,uSunI,uMoonI,uFogDensity,uRain,uLetterR[8]; uniform vec2 uWind;
varying vec3 vWorld,vNormal; varying float vCrest,vJ;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float lnoiseW(vec2 p){return noise(p);}
float surf(vec2 p,float dist){
  vec2 w=uWind*uTime;
  float f1=1.-smoothstep(25.,140.,dist), f2=1.-smoothstep(10.,60.,dist), f3=1.-smoothstep(5.,30.,dist);
  float h=noise(p*1.4+w*0.9)*0.5;
  h+=noise(p*3.3-w*0.6+vec2(uTime*0.3,0.))*0.28*f1;
  h+=noise(p*8.5+w*1.8)*0.14*f2;
  h+=noise(p*19.+vec2(uTime*2.,-uTime*1.5))*0.08*(1.+uRain*4.)*f3;
  return h;}
void main(){
  vec3 V=normalize(cameraPosition-vWorld); float dist=length(cameraPosition-vWorld);
  vec2 p=vWorld.xz; float e=0.05;
  float rough=clamp(0.05+0.25*uIntensity+uRain*0.2,0.,1.); float farS=1.-0.85*smoothstep(40.,500.,dist);
  float hx=surf(p+vec2(e,0.),dist)-surf(p-vec2(e,0.),dist), hz=surf(p+vec2(0.,e),dist)-surf(p-vec2(0.,e),dist);
  float detail=(0.45+0.6*uIntensity+uRain*0.8)*(1.-0.8*smoothstep(10.,400.,dist));
  vec3 N=normalize(vNormal+vec3(-hx,0.,-hz)*detail*3.5);
  vec2 wd=normalize(uWind+vec2(1e-4,0.)); vec2 q=vec2(dot(p,wd),dot(p,vec2(-wd.y,wd.x)));
  float fn1=noise(q*vec2(0.7,2.6)+vec2(uTime*0.35,0.)), fn2=noise(q*vec2(2.0,7.0)-vec2(uTime*0.5,uTime*0.1));
  float pattern=smoothstep(0.32,0.78,fn1*0.6+fn2*0.4);
  float lace=smoothstep(0.4,0.9,noise(p*15.+uTime*0.5));
  float jf=smoothstep(0.75,0.25,vJ)*smoothstep(0.25,0.8,uIntensity)*1.3;
  float cf=smoothstep(0.6,1.0,vCrest)*smoothstep(0.5,1.1,uIntensity)*0.7;
  float whitecap=clamp(jf+cf,0.,1.)*mix(pattern,1.0,0.2);
  float ring=0.;
  for(int i=0;i<8;i++){float d=distance(p,uGlowPos[i].xz);float r=uLetterR[i];
    ring+=smoothstep(r+0.55,r+0.02,d)*(0.2+0.8*noise(p*4.5+vec2(uTime*0.8,float(i)*3.1)))*(0.4+0.6*noise(p*11.-uTime*1.1));}
  ring=clamp(ring,0.,1.)*0.45*(0.3+0.7*smoothstep(0.1,1.0,uIntensity));
  for(int i=0;i<2;i++){vec4 s=uSplash[i];float d=distance(p,s.xy);
    ring+=smoothstep(s.z,s.z*0.15,d)*s.w*(0.35+0.65*noise(p*5.+vec2(uTime*1.5,float(i)*7.)));}
  ring=clamp(ring,0.,1.);
  float foam=clamp(whitecap*(0.55+0.45*lace)+ring,0.,1.)*(1.-smoothstep(80.,320.,dist));
  N=normalize(mix(N,vec3(-hx,0.4,-hz),foam*0.35));
  float NdV=max(dot(N,V),0.);
  float F=(0.02+0.98*pow(1.-NdV,5.))*mix(1.0,0.55,smoothstep(30.,450.,dist)*(0.35+0.65*uIntensity));
  vec3 R=reflect(-V,N); R.y=max(R.y,0.03);
  vec3 refl=sRGBToLinear(textureCube(uEnv,R,1.2*rough+2.0*smoothstep(40.,700.,dist))).rgb*2.0;
  vec3 L=uSunDir; float NdL=max(dot(N,L),0.);
  float crest=clamp(vCrest*0.5+0.5,0.,1.);
  float sss=pow(max(dot(V,normalize(-L+N*0.35)),0.),4.)*(0.3+0.7*crest)*uSunI;
  vec3 body=uDeep*uSkyLight*2.5
           +uScatter*(uSkyLight*0.9*(0.15+0.35*crest)+uSunColor*uSunI*(NdL*0.22+sss*0.9))
           +uScatter*max(dot(N,uMoonDir),0.)*uMoonI*0.04;
  float whale=0.;
  if(uWhaleOn>0.){vec2 rel=p-uWhale.xy; float cy=cos(uWhale.z),sy=sin(uWhale.z); vec2 q=vec2(rel.x*cy-rel.y*sy,rel.x*sy+rel.y*cy)/uWhale.w;
    float bodyS=1.-smoothstep(0.7,1.05,length(q/vec2(1.9,9.0)));
    float head=1.-smoothstep(0.7,1.05,length((q-vec2(0.,6.5))/vec2(1.7,3.2)));
    float fl=1.-smoothstep(0.65,1.05,length((q-vec2(0.,-9.6))/vec2(3.4,1.1))); fl*=smoothstep(0.,0.5,abs(q.x)+0.2);
    float fin=1.-smoothstep(0.65,1.05,length((q-vec2(3.2,1.8))/vec2(2.4,0.8)));
    float fin2=1.-smoothstep(0.65,1.05,length((q-vec2(-3.2,1.8))/vec2(2.4,0.8)));
    whale=clamp(max(max(bodyS,head),max(fl,max(fin,fin2))),0.,1.)*uWhaleOn*(0.7+0.3*lnoiseW(p*0.8+uTime*0.2));}
  body*=1.-0.8*whale;
  vec3 col=mix(body,refl,F); col*=1.-0.68*whale;
  vec3 H=normalize(L+V); float NdH=max(dot(N,H),0.);
  col+=uSunColor*(pow(NdH,mix(1500.,300.,rough))*3.0*farS+pow(NdH,mix(80.,25.,rough))*0.15)*uSunI*smoothstep(-0.02,0.05,L.y);
  vec3 Hm=normalize(uMoonDir+V); float NdHm=max(dot(N,Hm),0.);
  col+=vec3(0.7,0.8,1.0)*(pow(NdHm,mix(900.,250.,rough))*1.6+pow(NdHm,40.)*0.04)*uMoonI;
  for(int i=0;i<8;i++){vec3 Lv=uGlowPos[i]-vWorld;float d2=dot(Lv,Lv);vec3 Ld=Lv*inversesqrt(d2);float att=1./(1.+d2*0.3);
    vec3 Hg=normalize(Ld+V);
    col+=uGlowCol[i]*att*(max(dot(N,Ld),0.)*0.12+pow(max(dot(N,Hg),0.),90.)*1.2);}
  vec3 foamCol=vec3(0.94,0.96,0.98)*(uSkyLight*1.7+uSunColor*uSunI*(0.35+0.65*NdL)*0.7+vec3(0.05,0.06,0.08)*uMoonI);
  col=mix(col,foamCol,foam);
  float fog=1.-exp(-dist*uFogDensity);
  col=mix(col,uFogColor,fog);
  float alpha=1.-(1.-F)*0.72*(1.-foam)*(1.-smoothstep(10.,45.,dist));
  alpha=mix(alpha,1.0,whale*0.95);
  gl_FragColor=vec4(col,alpha);
#include <tonemapping_fragment>
#include <encodings_fragment>
}`;

// GLSL helpers injected into the standard materials (ice, heat damage, orca markings)
const NOISE_GLSL=`
float lhash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float lnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=lhash(i),b=lhash(i+vec2(1,0)),c=lhash(i+vec2(0,1)),d=lhash(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}`;
const VARY_GLSL=`varying vec3 vWPos; varying vec3 vWNormal; varying vec3 vLocal;`;
function injectVertex(shader){
  shader.vertexShader=shader.vertexShader
    .replace('#include <common>','#include <common>\n'+VARY_GLSL)
    .replace('#include <begin_vertex>','#include <begin_vertex>\nvWPos=(modelMatrix*vec4(transformed,1.)).xyz; vWNormal=normalize(mat3(modelMatrix)*objectNormal); vLocal=position;');
}

// ---------- renderer / scene ----------

// ---------- spray: water hitting the letters ----------
const SPRAY_N=3000, sprayPos=new Float32Array(SPRAY_N*3), sprayLife=new Float32Array(SPRAY_N), sprayD=[];
for(let i=0;i<SPRAY_N;i++){sprayD.push({x:0,y:-10,z:0,vx:0,vy:0,vz:0,life:0,max:1,size:0.05});sprayLife[i]=0;}
const sprayGeo=new THREE.BufferGeometry(); sprayGeo.setAttribute('position',new THREE.BufferAttribute(sprayPos,3)); sprayGeo.setAttribute('life',new THREE.BufferAttribute(sprayLife,1));
sprayGeo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),100);
const sprayMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  uniforms:{uColor:{value:new THREE.Color(1,1,1)}},
  vertexShader:`attribute float life; varying float vA; void main(){vec4 mv=modelViewMatrix*vec4(position,1.); float d=-mv.z;
      gl_PointSize=clamp((0.05+0.06*(1.-life))*(420./d),1.0,40.); vA=smoothstep(0.,0.15,life)*smoothstep(1.,0.6,life)*0.85; gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 uColor; varying float vA; void main(){vec2 c=gl_PointCoord-0.5; float a=smoothstep(0.5,0.2,length(c))*vA; gl_FragColor=vec4(uColor,a);}`});
const spray=new THREE.Points(sprayGeo,sprayMat); spray.frustumCulled=false; scene.add(spray);
let sprayCursor=0;
function stepSpray(dt,t,inten,W){
  const rate=(inten-0.35)*160; // particles per second per letter once the sea is up
  if(rate>0){for(const L of letters){let n=rate*dt*(0.5+Math.random());
    while(n>0){if(Math.random()<n){const d=sprayD[sprayCursor];sprayCursor=(sprayCursor+1)%SPRAY_N;
        const side=Math.random()<0.5?-1:1, u=(Math.random()*2-1);
        d.x=L.p.x+u*L.halfW; d.z=L.p.z+side*0.36; const w=waterAt(d.x,d.z,t,inten); d.y=w.y+0.05+Math.random()*0.2;
        const burst=0.6+1.6*Math.max(0,-w.ny+1)*4+Math.random();
        d.vx=(Math.random()-0.5)*1.6+W.wind[0]*0.6; d.vy=1.2+Math.random()*2.4*inten*burst; d.vz=side*(0.6+Math.random()*1.4)+W.wind[1]*0.6;
        d.life=0; d.max=0.45+Math.random()*0.55;}
      n-=1;}}}
  let k=0;
  for(let i=0;i<SPRAY_N;i++){const d=sprayD[i];
    if(d.life<d.max){d.life+=dt;d.vy-=9.8*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;sprayLife[i]=d.life/d.max;}else{sprayLife[i]=1;d.y=-10;}
    sprayPos[k++]=d.x;sprayPos[k++]=d.y;sprayPos[k++]=d.z;}
  sprayGeo.attributes.position.needsUpdate=true; sprayGeo.attributes.life.needsUpdate=true;
  sprayMat.uniforms.uColor.value.copy(waterUniforms.uSkyLight.value).multiplyScalar(1.6).add(skyUniforms.uSunColor.value.clone().multiplyScalar(0.4*skyUniforms.uSunI.value)).addScalar(0.15);
}

const WHALE_T0=0.60,WHALE_T1=0.76;
function updateWhale(p,t){
  const u=(p-WHALE_T0)/(WHALE_T1-WHALE_T0);
  if(u<0||u>1){whale.visible=false;waterUniforms.uWhaleOn.value=0;return;}
  whale.visible=true;
  const x=lerp(33,-29,u), z=lerp(0,8,u)+1.5*Math.sin(u*6.28), y=-4.6-0.5*Math.sin(t*0.6);
  whaleMat.color.copy(skyUniforms.uOcean.value).multiplyScalar(0.3);
  const dx=-62, dz=9+1.5*6.28*Math.cos(u*6.28);
  whale.position.set(x,y,z); whale.lookAt(x+dx,y,z+dz); whale.rotation.z=0.05*Math.sin(t*0.5);
  waterUniforms.uWhale.value.set(x,z,Math.atan2(dx,dz),1.0); waterUniforms.uWhaleOn.value=smooth(0,0.1,u)*(1-smooth(0.9,1,u));
}

const sunDir=skyUniforms.uSunDir.value, moonDir=skyUniforms.uMoonDir.value;
function skyPath(hour,rise,set,maxEl,out){

  else{const nl=24-dayLen; let g=hour<rise?(hour-set+24)/nl:(hour-set)/nl; el=-maxEl*0.9*Math.sin(Math.PI*g); az=-50-g*260;}

  const nl=24-(set-rise); const g=hour<rise?(hour-set+24)/nl:(hour-set)/nl; const mel=15*DEG*Math.sin(Math.PI*g), maz=lerp(42,-42,g)*DEG;

  const u=skyUniforms;
  u.uZenith.value.copy(NZ).lerp(DZ,day).lerp(t1.copy(GREY).multiplyScalar(day),cloud*0.4);
  u.uHorizon.value.copy(NH).lerp(DH,day).lerp(SUNSET,warm*0.8*(1-cloud*0.5));
  u.uSunColor.value.copy(SUNLOW).lerp(SUNHIGH,smooth(0,0.3,sunY)).lerp(t1.setRGB(1,1,0.97),W.scorch*0.5);
  u.uCloudLit.value.copy(t1.setRGB(0.05,0.06,0.10)).lerp(t2.setRGB(0.96,0.96,0.98),day).lerp(t3.copy(u.uSunColor.value).multiplyScalar(1.1),warm*0.6);
  u.uCloudShadow.value.copy(t1.setRGB(0.02,0.025,0.04)).lerp(t2.setRGB(0.40,0.45,0.54),day).lerp(t3.setRGB(0.55,0.35,0.32),warm*0.35);
  u.uFogColor.value.copy(u.uHorizon.value).lerp(u.uCloudShadow.value,cloud*0.55).lerp(t1.setRGB(0.85,0.87,0.9),W.blizzard*0.7*day);

// ---------- letter physics ----------
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),_a=new THREE.Vector3(),_b=new THREE.Vector3(),_d=new THREE.Vector3(),_m=new THREE.Vector3(),_c=new THREE.Vector3();

  const stiff=1+6*W.ice; // frozen letters barely rock
  for(let i=0;i<letters.length;i++){const L=letters[i];
    L.fx=0.45*Math.sin(t*0.31+i*1.7)*Math.cos(t*0.17+i*0.9)+W.wind[0]*0.1*W.wave;
    L.fz=0.45*Math.cos(t*0.27+i*2.3)*Math.sin(t*0.13+i*0.6)+W.wind[1]*0.1*W.wave;
    L.tq=0;}
  for(const R of ropes){anchor(R.a,1,_a);anchor(R.b,-1,_b);_d.subVectors(_b,_a);const d=_d.length()||1e-4;_d.divideScalar(d);
    let f=0; if(d>R.len)f=45*(d-R.len)+4*Math.max(0,_m.subVectors(R.b.v,R.a.v).dot(_d)); else if(d<R.min)f=-30*(R.min-d);

const pelIn=new THREE.CatmullRomCurve3([new THREE.Vector3(34,10,-34),new THREE.Vector3(22,7.5,-20),new THREE.Vector3(14,4,-8),new THREE.Vector3(10.4,1.6,0.4),new THREE.Vector3(8.3,0.45,2.0)]);
const pelOut=new THREE.CatmullRomCurve3([new THREE.Vector3(8.3,0.45,2.0),new THREE.Vector3(6,1.4,6),new THREE.Vector3(-4,4,9),new THREE.Vector3(-22,9,4),new THREE.Vector3(-40,13,-8)]);

function updatePelican(p,t,inten){

// ---------- precipitation ----------
function stepPrecip(dt,W,t,amb){
  const cx=camera.position.x,cz=camera.position.z;
  rainMat.uniforms.uOpacity.value=Math.min(0.75,0.65*W.rain); rain.visible=W.rain>0.02;
  if(rain.visible){const wx=W.wind[0]*4.5,wz=W.wind[1]*4.5,hb=RAIN_BOX/2;
    rainMat.uniforms.uDir.value.set(-wx*0.045,1,-wz*0.045).normalize();
    rainMat.uniforms.uColor.value.setRGB(0.82,0.87,0.94).multiplyScalar(clamp(0.18+amb*1.1,0.18,1));
    let k=0;
    for(const d of rainD){d.y-=d.s*dt;d.x+=wx*dt;d.z+=wz*dt;if(d.y<0)d.y+=RAIN_H;if(d.x>hb)d.x-=RAIN_BOX;if(d.x<-hb)d.x+=RAIN_BOX;if(d.z>hb)d.z-=RAIN_BOX;if(d.z<-hb)d.z+=RAIN_BOX;
      rainOff[k++]=cx+d.x;rainOff[k++]=d.y;rainOff[k++]=cz+d.z;}
    rainGeo.attributes.offset.needsUpdate=true;}
  snowMat.uniforms.uOpacity.value=Math.min(1,0.95*W.snow); snow.visible=W.snow>0.02;
  if(snow.visible){const gust=1+W.blizzard*3, wx=W.wind[0]*1.2*gust,wz=W.wind[1]*1.2*gust,hb=SNOW_BOX/2, fall=1+1.2*W.blizzard;
    snowMat.uniforms.uColor.value.setRGB(0.95,0.97,1.0).multiplyScalar(clamp(0.3+amb,0.3,1));
    let k=0;
    for(const d of snowD){d.y-=d.s*fall*dt;d.x+=(wx+Math.sin(t*1.3+d.ph)*d.sw*gust)*dt;d.z+=(wz+Math.cos(t*1.1+d.ph)*d.sw)*dt;
      if(d.y<-0.3)d.y+=SNOW_H;if(d.x>hb)d.x-=SNOW_BOX;if(d.x<-hb)d.x+=SNOW_BOX;if(d.z>hb)d.z-=SNOW_BOX;if(d.z<-hb)d.z+=SNOW_BOX;
      snowPos[k++]=cx+d.x;snowPos[k++]=d.y;snowPos[k++]=cz+d.z;}
    snowGeo.attributes.position.needsUpdate=true;}
}

// ---------- main loop ----------
const clock=new THREE.Clock(); let frameNo=0, tWave=0, dayTime=0.31*DAY_SECONDS, dayIndex=0; // start winter, early morning
function frame(){
  requestAnimationFrame(frame);
  const dt=clamp(clock.getDelta(),0,0.05); tWave+=dt;
  dayTime+=dt; if(dayTime>=DAY_SECONDS){dayTime-=DAY_SECONDS;dayIndex++;}
  const p=dayTime/DAY_SECONDS, hour=p*24, winter=(dayIndex%2===0);
  let W=weatherFor(winter,p);
  if(p<0.1){W=blendW(weatherFor(!winter,1),W,smooth(0,0.1,p));}   // cross-fade from the previous day at midnight
  const inten=clamp(W.wave,0.03,1.22);
  updateEnvironment(hour,winter,W);
  fxUniforms.uIce.value=W.ice; fxUniforms.uDegrade.value=W.degrade;
  skyUniforms.uTime.value=tWave; waterUniforms.uTime.value=tWave; waterUniforms.uIntensity.value=inten;
  placeCamera(tWave); sky.position.copy(camera.position); skyCube.position.copy(cubeCam.position);
  stepLetters(dt,tWave,inten,W);
  const glowMul=(1-0.85*W.degrade)*(1-0.45*W.ice), nightF=1-smooth(-0.1,0.15,sunDir.y);
  letterMat.emissiveIntensity=0.1+0.9*nightF; iceMat.emissive.copy(waterUniforms.uSkyLight.value).multiplyScalar(0.55);
  for(let i=0;i<8;i++){const L=letters[i];waterUniforms.uLetterR.value[i]=L.halfW*0.85;waterUniforms.uGlowPos.value[i].set(L.p.x,L.p.y-0.35,L.p.z);waterUniforms.uGlowCol.value[i].copy(GLOW).multiplyScalar((0.25+0.6*nightF)*glowMul);}
  if(winter)updateOrca(p,tWave,inten); else orca.visible=false;
  if(!winter)updatePelican(p,tWave,inten); else pelican.visible=false;
  if(!winter)updateWhale(p,tWave); else {whale.visible=false;waterUniforms.uWhaleOn.value=0;}
  stepSpray(dt,tWave,inten,W);
  if(!winter)waterUniforms.uSplash.value[0].w=0; if(winter)waterUniforms.uSplash.value[1].w=0;
  stepPrecip(dt,W,tWave,lastAmb);
  if((frameNo++&1)===0)cubeCam.update(renderer,scene);
  renderer.shadowMap.needsUpdate=true;
  renderer.render(scene,camera);
}
frame();
</script>
